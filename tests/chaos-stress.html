<!doctype html><meta charset="utf-8"><style>body{font:14px sans-serif;background:#eee}#cases{display:grid;grid-template-columns:repeat(3,320px);gap:12px}img{display:block;width:320px;height:240px}pre{white-space:pre-wrap;font-size:11px}</style><div id="cases"></div><pre>Running</pre><script type="module">
import {OilEngine} from '../src/engine.js';import {unhalf} from '../src/color.js';
const tables=await fetch('../reference/tables.json').then(r=>r.json()),logs=[];let seed=190927;const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
async function snap(e,title){e.step({fluid:false});await e.device.queue.onSubmittedWorkDone();const el=document.createElement('section'),img=document.createElement('img');el.textContent=title;img.src=URL.createObjectURL(await e.exportPNG());el.append(img);document.querySelector('#cases').append(el);}
async function measure(e){const N=256*192;let d=0,p=0,maxDepth=0,bad=0,maxSpectrum=0;const h=new Float32Array(N);for(let k=0;k<e.config.nl;k++){const a=new Float32Array(await e.read('l'+k)),s=new Uint32Array(await e.read('s'+k));for(let i=0;i<N;i++){const v=a[i*4],pig=a[i*4+1];if(!Number.isFinite(v)||!Number.isFinite(pig)||v<0||pig<0||pig>v+1e-8)bad++;d+=v;p+=pig;h[i]+=v;if(pig>1e-8){for(let j=0;j<39;j++){const f=unhalf((s[i*20+(j>>1)]>>((j%2)*16))&65535);if(!Number.isFinite(f)||f<0)bad++;maxSpectrum=Math.max(maxSpectrum,f);}}}}for(const v of h)maxDepth=Math.max(maxDepth,v);if(bad)throw Error('Invalid cells: '+bad);return {d,p,maxDepth,maxSpectrum};}
try{for(const phi of [.02,.15,1]){const e=await OilEngine.create(document.createElement('canvas'),tables,{nx:256,ny:192,nl:phi===.15?3:2,width:.125,phi,tiltY:15});try{let time=0;const colors=['#c83228','#2c6496','#f0d254','#fffaf0','#252923','#534379','#3b6653'];
for(let stroke=0;stroke<90;stroke++){e.config.radius=2+rnd()*62;e.color=colors[stroke%colors.length];const pressure=stroke%11===0?.001:.2+.8*rnd();let x=rnd()*256,y=rnd()*192;e.beginStroke({x,y,pressure,time:time+=16},{empty:stroke%7===6});const count=stroke%4===0?0:8;for(let j=0;j<count;j++){x=Math.max(-15,Math.min(271,x+(rnd()-.5)*160));y=Math.max(-15,Math.min(207,y+(rnd()-.5)*160));e.moveStroke({x,y,pressure,time:time+=16});e.step();await e.device.queue.onSubmittedWorkDone();}e.endStroke();e.step();await e.device.queue.onSubmittedWorkDone();if(stroke%15===0)await measure(e);}
await snap(e,phi*100+'% / 90 strokes');const before=await measure(e);let previous=before;for(let j=0;j<1200;j++){if(j%300===0){e.config.tiltX=[0,60,0,-60][j/300];e.config.tiltY=[60,0,-60,0][j/300];}e.step({present:false});if(j%20===19)await e.device.queue.onSubmittedWorkDone();if(j%300===299){const now=await measure(e);if(now.d>previous.d+1e-5||now.p>previous.p+1e-5)throw Error('Paint created during idle flow');previous=now;}}
await snap(e,phi*100+'% / tilt sweep after 20 sec');const after=await measure(e);e.dryRequested=true;e.step({fluid:false});await e.device.queue.onSubmittedWorkDone();const bed=new Float32Array(await e.read('bed'));let height=0;for(let i=0;i<256*192;i++)height+=bed[i*20];const dryError=Math.abs(height-after.d)/Math.max(after.d,1e-30);if(dryError>1e-5)throw Error('Drying changed height');logs.push({phi,before,after,dryError});if(e.errors.length)throw Error(e.errors.join('\n'));}finally{e.destroy();}}window.testResult={ok:true,logs};}catch(e){window.testResult={ok:false,error:e.stack,logs};}document.querySelector('pre').textContent=JSON.stringify(window.testResult);
</script>
