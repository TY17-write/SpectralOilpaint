<!doctype html><meta charset="utf-8"><style>body{font:16px sans-serif;background:#eee}#cases{display:flex;gap:16px}img{width:512px;height:256px}pre{white-space:pre-wrap}</style><div id="cases"></div><pre>Running</pre><script type="module">
import {OilEngine} from '../src/engine.js';import {paint,pack} from '../src/color.js';
try{const tables=await fetch('../reference/tables.json').then(r=>r.json()),e=await OilEngine.create(document.createElement('canvas'),tables,{nx:256,ny:128,nl:2,width:.125,shading:true}),N=256*128,l=new Float32Array(N*4),s=new Uint32Array(N*20),logs=[];
try{for(let y=0;y<128;y++)for(let x=0;x<256;x++){const i=y*256+x;const raised=x>35&&x<220&&y>25&&y<100;l[i*4]=.00015+(raised?.001+.0001*Math.sin(x*.5):0);l[i*4+1]=.0001;const p=paint(y<64?[255,250,240]:[200,50,40],tables);for(let j=0;j<19;j++)s[i*20+j]=pack(p.a[2*j],p.a[2*j+1]);s[i*20+19]=pack(p.beta,0);}e.device.queue.writeBuffer(e.buffers.l0,0,l);e.device.queue.writeBuffer(e.buffers.s0,0,s);const initial=await e.read('l0');
const modern={wetRough:e.config.wetRough,zScale:e.config.zScale,ambient:e.config.ambient,diffuse:e.config.diffuse};
for(const setting of [{name:'Before',wetRough:.15,zScale:1,ambient:.25,diffuse:.75},{name:'After',...modern}]){Object.assign(e.config,setting);e.step({fluid:false});await e.device.queue.onSubmittedWorkDone();const blob=await e.exportPNG(),b=await createImageBitmap(blob),c=new OffscreenCanvas(256,128),ctx=c.getContext('2d');ctx.drawImage(b,0,0);const p=ctx.getImageData(0,0,256,128).data;let min=255,max=0;for(let y=8;y<56;y++)for(let x=8;x<248;x++){const v=p[(y*256+x)*4];min=Math.min(min,v);max=Math.max(max,v);}logs.push({name:setting.name,min,max,range:max-min});const section=document.createElement('section'),img=document.createElement('img');section.textContent=setting.name;img.src=URL.createObjectURL(blob);section.append(img);document.querySelector('#cases').append(section);}
const final=await e.read('l0');if(new Uint8Array(initial).some((v,i)=>v!==new Uint8Array(final)[i]))throw Error('Lighting altered paint');if(logs[1].range>=logs[0].range*.65||logs[1].range<1)throw Error('Relief contrast not reduced appropriately');if(e.errors.length)throw Error(e.errors.join('\n'));window.testResult={ok:true,logs};}finally{e.destroy();}}catch(e){window.testResult={ok:false,error:e.stack};}document.querySelector('pre').textContent=JSON.stringify(window.testResult);
</script>
