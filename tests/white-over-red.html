<!doctype html><meta charset="utf-8" /><title>
  White over wet red diagnostic</title
><style>
  body {
    font: 14px sans-serif;
    margin: 16px;
    background: #eee;
  }
  #cases {
    display: grid;
    grid-template-columns: 512px 512px;
    gap: 16px;
  }
  img {
    width: 512px;
    height: 192px;
    display: block;
  }
  pre {
    white-space: pre-wrap;
    font-size: 11px;
  }
</style>
<div id="cases"></div>
<pre id="result">Running</pre>
<script type="module">
  import { OilEngine } from "../src/engine.js";
  import { paint, pack, unhalf } from "../src/color.js";
  try {
    const tables = await fetch("../reference/tables.json").then((r) =>
      r.json(),
    );
    const logs = [];
    for (const settings of [
      { name: "Wet red / white 50% / tilt 60", fluid: true },
      { name: "Thick wet red 3 mm / white 50%", fluid: true, depth: 0.003 },
      { name: "Dry red / white 50%", fluid: true, dry: true },
      { name: "Wet red / white 100%", fluid: true, phi: 1 },
    ]) {
      const canvas = document.createElement("canvas");
      const e = await OilEngine.create(canvas, tables, {
        nx: 1024,
        ny: 384,
        nl: 2,
        width: 0.5,
        radius: 128,
        phi: 0.5,
        tiltY: 60,
        shading: false,
        ...settings,
      });
      const N = 1024 * 384,
        red = paint([200, 50, 40], tables),
        white = paint([255, 250, 240], tables),
        a = new ArrayBuffer(N * 16),
        f = new Float32Array(a),
        u = new Uint32Array(a),
        s = new Uint32Array(N * 20);
      for (let i = 0; i < N; i++) {
        f[i * 4] = settings.depth || 0.001;
        f[i * 4 + 1] = f[i * 4];
        u[i * 4 + 3] = 1;
        if (settings.dry) f[i * 4 + 2] = 1;
        for (let j = 0; j < 19; j++)
          s[i * 20 + j] = pack(red.a[2 * j], red.a[2 * j + 1]);
        s[i * 20 + 19] = pack(red.beta, 0);
      }
      e.device.queue.writeBuffer(e.buffers.l0, 0, a);
      e.device.queue.writeBuffer(e.buffers.s0, 0, s);
      if (settings.dry) {
        e.dryRequested = true;
        e.step({ fluid: false });
        await e.device.queue.onSubmittedWorkDone();
      }
      e.strokeId = 1;
      e.color = "#fffaf0";
      e.beginStroke({ x: 200, y: 192, pressure: 0.75, time: 0 });
      for (let j = 1; j <= 36; j++) {
        e.moveStroke({
          x: 200 + (580 * j) / 36,
          y: 192,
          pressure: 0.75,
          time: j * 16,
        });
        if (settings.noMotion)
          for (const stamp of e.pending) stamp.vx = stamp.vy = 0;
        e.step({ fluid: settings.fluid });
        await e.device.queue.onSubmittedWorkDone();
      }
      e.endStroke();
      const ls = await Promise.all(
          [0, 1].map(async (k) => new Float32Array(await e.read("l" + k))),
        ),
        sp = await Promise.all(
          [0, 1].map(async (k) => new Uint32Array(await e.read("s" + k))),
        );
      const profiles = [];
      for (const y of [68, 80, 96, 128, 160, 192, 224, 256, 288, 304, 316]) {
        const i = y * 1024 + 512;
        let whiteP = 0,
          depth = 0;
        const layer = [];
        for (let k = 0; k < 2; k++) {
          const beta = unhalf(sp[k][i * 20 + 19] & 65535),
            fraction = Math.max(
              0,
              Math.min(1, (beta - red.beta) / (white.beta - red.beta)),
            );
          whiteP += ls[k][i * 4 + 1] * fraction;
          depth += ls[k][i * 4];
          layer.push({ d: ls[k][i * 4], p: ls[k][i * 4 + 1], white: fraction });
        }
        profiles.push({ y, whiteP, depth, layer });
      }
      const blob = await e.exportPNG(),
        bitmap = await createImageBitmap(blob),
        temp = new OffscreenCanvas(1024, 384),
        ctx = temp.getContext("2d");
      ctx.drawImage(bitmap, 0, 0);
      const pixels = ctx.getImageData(0, 0, 1024, 384).data;
      let greenMin = 255,
        greenMax = 0;
      for (let y = 170; y <= 214; y++)
        for (let x = 350; x <= 650; x++) {
          const green = pixels[(y * 1024 + x) * 4 + 1];
          greenMin = Math.min(greenMin, green);
          greenMax = Math.max(greenMax, green);
        }
      if (greenMin < 50 || greenMax - greenMin > 12)
        throw Error(
          "Mottled interior: " +
            settings.name +
            " " +
            greenMin +
            ".." +
            greenMax,
        );
      for (const p of profiles)
        p.rgb = Array.from(
          pixels.subarray((p.y * 1024 + 512) * 4, (p.y * 1024 + 512) * 4 + 3),
        );
      const center = profiles.find((p) => p.y === 192);
      const edge = profiles.filter((p) => [80, 304].includes(p.y));
      if (center.rgb[1] < 50 || edge.some((p) => p.rgb[1] > center.rgb[1] + 3))
        throw Error(
          "Hollow overpaint: " +
            settings.name +
            " " +
            JSON.stringify({ center, edge }),
        );
      const section = document.createElement("section");
      section.textContent = settings.name;
      const img = document.createElement("img");
      img.src = URL.createObjectURL(blob);
      section.append(img);
      document.getElementById("cases").append(section);
      logs.push({
        name: settings.name,
        interiorGreenRange: [greenMin, greenMax],
        profiles: profiles
          .filter((p) => [80, 192, 304].includes(p.y))
          .map((p) => ({ y: p.y, rgb: p.rgb, whiteP: p.whiteP })),
      });
      if (e.errors.length) throw Error(e.errors.join("\n"));
      e.destroy();
    }
    window.testResult = { ok: true, logs };
  } catch (e) {
    window.testResult = { ok: false, error: e.stack || e.message };
  }
  document.getElementById("result").textContent = JSON.stringify(
    window.testResult,
  );
</script>
