<!doctype html><meta charset="utf-8" /><title>Brush GPU acceptance</title
><canvas></canvas>
<pre>Running</pre>
<script type="module">
  import { OilEngine } from "../src/engine.js";
  import { paint, unhalf, composite, deltaE } from "../src/color.js";
  try {
    const tables = await fetch("../reference/tables.json").then((r) =>
        r.json(),
      ),
      gold = await fetch("brush-reference.json").then((r) => r.json()),
      e = await OilEngine.create(document.querySelector("canvas"), tables, {
        nx: 160,
        ny: 64,
        nl: 2,
        width: (160 * 0.5) / 1024,
        shading: false,
        referenceMode: true,
        deposit: 0.1,
        pickup: 0.1,
      });
    const assert = (x, m) => {
        if (!x) throw Error(m);
      },
      logs = [];
    const stamp = (x, id, p, first = false, empty = false) => ({
      x: x + 0.5,
      y: 32.5,
      r: 12,
      pressure: 1,
      vx: 0,
      vy: 0,
      phi: 1,
      id,
      paint: p,
      first,
      empty,
      refill: empty ? 0 : 0.05,
    });
    for (const [id, rgb] of [
      [1, [30, 60, 200]],
      [2, [200, 30, 30]],
    ]) {
      const p = paint(rgb, tables);
      for (let i = 0; i <= 40; i++)
        e.pending.push(stamp(20 + (120 * i) / 40, id, p, i === 0));
      e.step({ fluid: false });
      await e.device.queue.onSubmittedWorkDone();
    }
    async function spectra() {
      const ls = await Promise.all(
          [0, 1].map(async (k) => new Float32Array(await e.read("l" + k))),
        ),
        ss = await Promise.all(
          [0, 1].map(async (k) => new Uint32Array(await e.read("s" + k))),
        );
      return (x, y) => {
        const i = y * 160 + x;
        let r = Array(38).fill(unhalf(0x3bf6));
        for (let k = 0; k < 2; k++) {
          const a = Array.from({ length: 38 }, (_, j) =>
              unhalf((ss[k][i * 20 + (j >> 1)] >>> ((j % 2) * 16)) & 65535),
            ),
            beta = unhalf(ss[k][i * 20 + 19] & 65535);
          r = composite({ a, beta }, ls[k][i * 4 + 1], r);
        }
        return r;
      };
    }
    const linear = (r) => {
      const xyz = tables.cmf.map((row) =>
        row.reduce((s, a, i) => s + a * r[i], 0),
      );
      return tables.xyz_to_rgb.map((row) =>
        Math.max(
          0,
          Math.min(
            1,
            row.reduce((s, a, i) => s + a * xyz[i], 0),
          ),
        ),
      );
    };
    const hf = (sample) => {
      let sum = 0,
        n = 0;
      for (let y = 27; y < 38; y++)
        for (let x = 41; x < 119; x++) {
          const p = linear(sample(x, y)),
            neighbors = [
              [x - 1, y],
              [x + 1, y],
              [x, y - 1],
              [x, y + 1],
            ].map(([x, y]) => linear(sample(x, y)));
          for (let j = 0; j < 3; j++) {
            sum += (p[j] - neighbors.reduce((s, p) => s + p[j], 0) / 4) ** 2;
            n++;
          }
        }
      return Math.sqrt(sum / n) * 255;
    };
    const before = await spectra(),
      noiseBefore = hf(before);
    assert(noiseBefore < 1, "T-S1 initial HF " + noiseBefore);
    const luminance = (x, y) =>
      linear(before(x, y)).reduce(
        (s, v, i) => s + v * [0.2126, 0.7152, 0.0722][i],
        0,
      );
    const ground = luminance(80, 5),
      interior = luminance(80, 32),
      edge = Math.min(
        ...Array.from({ length: 27 }, (_, i) => luminance(80, i + 19)),
      );
    assert(edge >= Math.min(ground, interior) - 0.01, "T-S2 dark edge");
    logs.push({ id: "T-S2", ground, interior, minEdge: edge });
    const stageErrors = [];
    async function stage(k) {
      const f = new Float32Array(await e.read("l0"));
      let err = 0;
      for (let x = 0; x < 160; x++)
        err = Math.max(
          err,
          Math.abs(f[(32 * 160 + x) * 4] - gold.stages[k][0][x]),
        );
      let arg = 0;
      for (let x = 0; x < 160; x++)
        if (Math.abs(f[(32 * 160 + x) * 4] - gold.stages[k][0][x]) === err)
          arg = x;
      stageErrors.push([
        err,
        arg,
        f[(32 * 160 + arg) * 4],
        gold.stages[k][0][arg],
      ]);
    }
    await stage(0);
    const gray = paint([128, 128, 128], tables);
    for (let k = 0; k < 20; k++) {
      for (let i = 0; i < 27; i++)
        e.pending.push(
          stamp(
            k % 2 ? 120 - (80 * i) / 26 : 40 + (80 * i) / 26,
            3 + k,
            gray,
            k === 0 && i === 0,
            true,
          ),
        );
      e.step({ fluid: false });
      await e.device.queue.onSubmittedWorkDone();
      await stage(k + 1);
    }
    const after = await spectra(),
      noiseAfter = hf(after);
    let max = 0,
      mean = 0;
    for (let y = 26; y < 39; y++)
      for (let x = 40; x < 120; x++) {
        const error = deltaE(after(x, y), gold.patch[y - 26][x - 40], tables);
        mean += error;
        max = Math.max(max, error);
      }
    mean /= 13 * 80;
    let beforeError = 0;
    for (let y = 26; y < 39; y++)
      for (let x = 40; x < 120; x++)
        beforeError = Math.max(
          beforeError,
          deltaE(before(x, y), gold.before[y - 26][x - 40], tables),
        );
    const gpuD = new Float32Array(await e.read("l0"));
    const gpuD1 = new Float32Array(await e.read("l1"));
    const gpuIDs = new Uint32Array(gpuD.buffer);
    const gpuIDs1 = new Uint32Array(gpuD1.buffer);
    let detail = [];
    for (const x of [40, 60, 80, 100, 119])
      detail.push([
        x,
        gpuD[(32 * 160 + x) * 4],
        gpuD1[(32 * 160 + x) * 4],
        gold.depth[0][6][x - 40],
        gold.depth[1][6][x - 40],
        gpuIDs[(32 * 160 + x) * 4 + 3],
        gpuIDs1[(32 * 160 + x) * 4 + 3],
        gold.ids[0][6][x - 40],
        gold.ids[1][6][x - 40],
      ]);
    let depthError = 0;
    for (let y = 26; y < 39; y++)
      for (let x = 40; x < 120; x++)
        depthError = Math.max(
          depthError,
          Math.abs(gpuD[(y * 160 + x) * 4] - gold.depth[0][y - 26][x - 40]),
        );
    assert(noiseAfter < 1, "T-S1 smudge HF " + noiseAfter);
    assert(
      max < 0.5,
      "T-S1 f64 max ΔE " +
        max +
        " mean " +
        mean +
        " beforeError " +
        beforeError +
        " depth " +
        depthError +
        " stages " +
        JSON.stringify(stageErrors) +
        " detail " +
        JSON.stringify(detail) +
        " noise " +
        noiseBefore +
        " / " +
        noiseAfter,
    );
    logs.push({
      id: "T-S1",
      stamps: 540,
      noiseBefore255: noiseBefore,
      noiseAfter255: noiseAfter,
      meanDeltaE: mean,
      maxDeltaE: max,
    });
    assert(e.errors.length === 0, e.errors.join("\n"));
    e.destroy();
    window.testResult = { ok: true, logs };
  } catch (e) {
    window.testResult = { ok: false, error: e.stack || e.message };
  }
  document.querySelector("pre").textContent = JSON.stringify(window.testResult);
</script>
