<!doctype html><meta charset="utf-8"><style>body{font:14px sans-serif}#cases{display:flex;gap:12px}img{width:128px;height:768px}pre{white-space:pre-wrap}</style><div id="cases"></div><pre>Running</pre><script type="module">
import {OilEngine} from '../src/engine.js';import {paint,unhalf} from '../src/color.js';
try{const tables=await fetch('../reference/tables.json').then(r=>r.json()),logs=[];for(const fluid of [true]){const e=await OilEngine.create(document.createElement('canvas'),tables,{nx:128,ny:768,nl:2,width:.0625,radius:29,phi:.15,tiltY:15,shading:false});try{async function step(){e.step({fluid});await e.device.queue.onSubmittedWorkDone();}async function stroke(color,points){e.color=color;e.beginStroke({x:points[0][0],y:points[0][1],pressure:.75,time:0});for(let j=1;j<points.length;j++){e.moveStroke({x:points[j][0],y:points[j][1],pressure:.75,time:j*100});await step();}e.endStroke();await step();}for(let k=0;k<8;k++)await stroke('#2c6496',[[64,65],[64,85],[64,105],[64,125]]);for(let j=0;j<6;j++)await stroke('#f0d254',[[50,40],[65,45],[78,40]]);for(let j=0;j<1800;j++)await step();const blob=await e.exportPNG(),bmp=await createImageBitmap(blob),c=new OffscreenCanvas(128,768),ctx=c.getContext('2d');ctx.drawImage(bmp,0,0);const px=ctx.getImageData(0,0,128,768).data;let pink=0,worst=0,location=[];for(let i=0;i<128*768;i++){const [r,g,b]=px.slice(i*4,i*4+3);const score=Math.min(r,b)-g;if(score>10)pink++;if(score>worst){worst=score;location=[i%128,Math.floor(i/128),r,g,b];}}logs.push({fluid,pink,worst,location});const section=document.createElement('section'),img=document.createElement('img');section.textContent=fluid?'Flow 30 sec / thick paint':'No flow';img.src=URL.createObjectURL(blob);section.append(img);document.querySelector('#cases').append(section);if(e.errors.length)throw Error(e.errors.join('\n'));}finally{e.destroy();}}window.testResult={ok:true,logs};}catch(e){window.testResult={ok:false,error:e.stack};}document.querySelector('pre').textContent=JSON.stringify(window.testResult);
</script>
